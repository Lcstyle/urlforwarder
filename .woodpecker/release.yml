steps:
  - name: build-release
    image: mars.sky.net:8418/lcstyle/flutter-android:21-jdk
    volumes:
      - urlforwarder-gradle:/root/.gradle
    environment:
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"
    commands:
      - chmod +x gradlew
      - ./gradlew assembleRelease
      - ls -lh app/build/outputs/apk/release/
    when:
      - event: tag

  - name: upload
    image: alpine:3.19
    commands:
      - apk add --no-cache curl jq
      - |
        for apk_file in app/build/outputs/apk/release/*.apk; do
          echo "Uploading $apk_file..."
        done
      - |
        RELEASE=$(curl --fail -s -X POST \
          "${CI_FORGE_URL}/api/v1/repos/${CI_REPO}/releases" \
          -H "Authorization: token ${GITEA_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"${CI_COMMIT_TAG}\",\"body\":\"Release ${CI_COMMIT_TAG}\",\"draft\":false,\"prerelease\":false}")
        RELEASE_ID=$(echo "$RELEASE" | jq -r '.id' | tr -d '[:space:]')
        echo "Created release ID: $RELEASE_ID"
        for apk_file in app/build/outputs/apk/release/*.apk; do
          BASENAME=$(basename "$apk_file")
          curl --fail -X POST \
            "${CI_FORGE_URL}/api/v1/repos/${CI_REPO}/releases/$RELEASE_ID/assets?name=$BASENAME" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -F "attachment=@$apk_file"
          echo "Uploaded $BASENAME"
        done
    when:
      - event: tag
